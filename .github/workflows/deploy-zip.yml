name: Extrair deploy.zip

on:
  push:
    paths:
      - 'deploy.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair o zip e substituir os arquivos
        run: |
          set -e
          if [ ! -f deploy.zip ]; then
            echo "deploy.zip nao encontrado"
            exit 0
          fi
          mkdir /tmp/novo
          unzip -q deploy.zip -d /tmp/novo
          # se o zip tiver uma unica pasta na raiz, entra nela
          if [ "$(ls -A /tmp/novo | wc -l)" = "1" ] && [ -d "/tmp/novo/$(ls -A /tmp/novo)" ]; then
            SRC="/tmp/novo/$(ls -A /tmp/novo)"
          else
            SRC="/tmp/novo"
          fi
          # apaga tudo, menos .git e .github
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$SRC"/. .

      - name: Commit e push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Nada mudou" && exit 0
          git commit -m "Atualizado via deploy.zip"
          git push
          
